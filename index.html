<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مغامرة البكسل</title>
<style>
:root{--bg:#1b1d2a;--fg:#f2f2f7;--ac:#ffd34d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d2a;--fg:#f2f2f7;--ac:#ffd34d}}
:root[data-theme="dark"]{--bg:#1b1d2a;--fg:#f2f2f7;--ac:#ffd34d}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow-y:auto;overflow-x:hidden}
#w{position:relative;width:min(100vw,calc((100vh - 130px)*400/224))}
#h{display:flex;justify-content:space-between;font-weight:700;padding:0 6px 6px;font-size:clamp(14px,3.4vw,20px);color:var(--ac)}
canvas{display:block;width:100%;aspect-ratio:400/224;image-rendering:pixelated;border-radius:6px;background:#000}
#m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(10,10,25,.62);border-radius:6px;font-size:clamp(15px,3.8vw,26px);line-height:1.8;padding:12px;cursor:pointer;white-space:pre-line;top:30px}
#tc{display:none;direction:ltr;gap:10px;width:100%;max-width:560px;justify-content:space-between;padding:0 10px;box-sizing:border-box}
#tc button{flex:1;height:64px;font-size:28px;border-radius:14px;border:2px solid var(--ac);background:#2a2d40;color:var(--fg);touch-action:none}
@media (pointer:coarse){#tc{display:flex}}
#lb{position:absolute;top:34px;left:6px;font-size:clamp(10px,2.4vw,13px);line-height:1.6;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;white-space:pre;direction:rtl;text-align:right}
#net{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}#net input{background:#2a2d40;color:var(--fg);border:2px solid var(--ac);border-radius:10px;padding:8px 10px;font-size:16px;width:140px;text-align:center}
#net button,#ed button,#inc button,#bx{background:#2a2d40;color:var(--fg);border:2px solid var(--ac);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
#ed button.on{background:var(--ac);color:#000}#ed{display:none;flex-direction:column;gap:6px;align-items:center;max-width:600px;padding:0 6px}.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}#ed input{background:#2a2d40;color:var(--fg);border:2px solid var(--ac);border-radius:10px;padding:8px;font-size:14px;width:150px;text-align:center}#tt{min-height:20px;color:var(--ac);font-size:14px}#tb button{font-size:20px;padding:6px 10px}
#lvs{background:#2a2d40;color:var(--fg);border:2px solid var(--ac);border-radius:10px;padding:8px;font-size:14px}#mu{background:none;border:0;font-size:inherit;color:inherit;cursor:pointer}
</style></head><body>
<div id="w"><div id="h"><span id="a"></span><span id="b"></span><span id="t"></span><button id="mu">🔊</button></div><canvas id="c" width="400" height="224"></canvas><div id="m"></div><div id="lb"></div></div>
<div id="net"><input id="nk" maxlength="10" placeholder="اسمك" autocomplete="off"><input id="rm" maxlength="12" placeholder="رمز الغرفة" value="main" autocomplete="off"><button id="be">🛠 مصمم المراحل</button><select id="lvs"></select><button id="br">🎲 غرفة جديدة</button></div>
<div id="ed"><div class="row" id="tb"></div><div class="row"><button data-a="test">▶ تجربة</button><button data-a="scl">◀</button><button data-a="scr">▶</button><button data-a="clr">🗑 مسح</button><button data-a="share">📡 شارك بالغرفة</button><button data-a="exit">✔ حفظ وخروج</button></div><div class="row"><input id="cd" placeholder="كود المرحلة"><button data-a="cp">نسخ الكود</button><button data-a="ld">تحميل كود</button></div></div>
<button id="bx" style="display:none">⏹ إنهاء التجربة</button><div id="inc"></div><div id="tt"></div>
<div id="tc"><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="j" style="flex:1.4">⤒ قفز</button></div>
